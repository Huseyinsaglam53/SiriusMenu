<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Sayfa Bulunamadı | Sirius Cafe</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#1d1709,#0a0a0a 65%);color:#efe7d6;font-family:Jost,Arial,sans-serif;font-weight:300}
h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(4rem,18vw,8rem);letter-spacing:.1em;background:linear-gradient(180deg,#f1d9a0,#b8924f);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#968e7b;margin:8px 0 28px}a{display:inline-block;padding:13px 34px;border:1px solid #d6b370;color:#d6b370;text-decoration:none;font-size:.75rem;letter-spacing:.25em;text-transform:uppercase}a:hover{background:#d6b370;color:#0a0a0a}
/* ===== KIŞ TEMASI BAŞLANGIÇ ===== */
:root{--bg:#07111d;--card:#0d1a2a;--line:#1f3650;--muted:#9db0c4;--ice:#bfe3ff}
#snow{position:fixed;inset:0;z-index:9;pointer-events:none}
@media(prefers-reduced-motion:reduce){#snow{display:none}}
body{background:radial-gradient(ellipse at 50% 35%,#1b3855,#07111d 65%)}
p{color:#9db0c4}
/* ===== KIŞ TEMASI BİTİŞ ===== */
</style></head>
<body><h1>404</h1><p>Aradığınız sayfa bulunamadı.</p><a href="/">Ana Sayfa</a><!-- KAR YAĞIŞI -->
<canvas id="snow" aria-hidden="true"></canvas>
<script>(function(){var c=document.getElementById('snow');if(!c||matchMedia('(prefers-reduced-motion:reduce)').matches)return;var x=c.getContext('2d'),F=[],W,H;
function sz(){W=c.width=innerWidth;H=c.height=innerHeight;F=[];for(var i=0,n=Math.min(130,W/9+25);i<n;i++)F.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.7,v:Math.random()*.8+.35,p:Math.random()*6.28})}
function d(){x.clearRect(0,0,W,H);x.fillStyle='#fff';F.forEach(function(f){f.p+=.012;f.y+=f.v;f.x+=Math.sin(f.p)*.4;if(f.y>H+4){f.y=-4;f.x=Math.random()*W}x.globalAlpha=.3+f.r/6;x.beginPath();x.arc(f.x,f.y,f.r,0,6.29);x.fill()});requestAnimationFrame(d)}
addEventListener('resize',sz);sz();d()})();</script>
</body></html>
