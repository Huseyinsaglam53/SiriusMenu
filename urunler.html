<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kendi Üretimimiz | Sirius Cafe</title>
<meta name="description" content="Sirius Cafe kendi üretimi doğal bal, zeytin, zeytinyağı, incir ve erik.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#111;--gold:#d6b370;--gold2:#a8854a;--text:#efe7d6;--muted:#968e7b;--line:#2a2418}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Jost,Arial,sans-serif;font-weight:300;background:radial-gradient(ellipse at 50% 0,#1d1709 0,#0a0a0a 55%) fixed;color:var(--text);line-height:1.6;overflow-x:clip}
h1,h2,h3,.logo{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400}
a{color:inherit;text-decoration:none}
.wrap{max-width:1000px;margin:auto;padding:0 22px}
.gold{background:linear-gradient(180deg,#f1d9a0,#b8924f);-webkit-background-clip:text;background-clip:text;color:transparent}
header{position:sticky;top:0;z-index:40;background:rgba(10,10,10,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:1.3rem;letter-spacing:.3em;color:var(--gold)}
.logo .mark{height:30px;width:auto}
header .nav{display:flex;gap:22px;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
header .nav a:hover{color:var(--gold)}
.top{text-align:center;padding:60px 0 34px}
h1{font-size:clamp(2.2rem,8vw,3.8rem);font-weight:300;letter-spacing:.22em;margin-right:-.22em;animation:fi 1s ease both}
.sub{color:var(--muted);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.25rem;margin-top:6px;animation:fi 1s .2s ease both}
.line{width:50px;height:1px;background:var(--gold);margin:22px auto 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px;padding-bottom:30px}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);padding:30px 26px 24px;display:flex;flex-direction:column;transition:.3s;opacity:0;animation:fi .7s ease both;animation-delay:calc(var(--k)*.08s + .2s)}
.card:hover{border-color:var(--gold2);transform:translateY(-6px);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.card i{font-style:normal;color:var(--gold);font-size:.9rem;margin-bottom:10px}
.card h3{color:var(--gold);font-size:1.6rem;line-height:1.2;margin-bottom:8px}
.card p{color:var(--muted);font-size:.92rem;flex:1}
.price{margin:18px 0 16px;padding-top:14px;border-top:1px solid var(--line);font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--gold);line-height:1}
.price small{font-family:Jost,sans-serif;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.price.ask{font-size:1.2rem;font-style:italic;color:var(--muted)}
.btn{display:inline-block;text-align:center;padding:11px 20px;border:1px solid var(--gold);color:var(--gold);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;transition:.3s}
.btn:hover{background:var(--gold);color:#0a0a0a}
.btn.fill{background:var(--gold);color:#0a0a0a}
.info{text-align:center;color:var(--muted);font-size:.85rem;padding:10px 0 50px}
.cta{text-align:center;padding-bottom:20px}
footer{text-align:center;color:var(--muted);font-size:.72rem;letter-spacing:.2em;padding:30px 0 36px;border-top:1px solid var(--line)}
footer a{color:var(--gold)}
@keyframes fi{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1}}
@media(max-width:560px){header .nav{gap:14px;font-size:.62rem}.logo span{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
<a class="logo" href="index.html"><svg class="mark" viewBox="0 0 120 150" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d9a0"/><stop offset="1" stop-color="#b8924f"/></linearGradient></defs><path d="M18 102A42 42 0 1 1 102 102" fill="none" stroke="url(#g)" stroke-width="1.6"/><path d="M60 38C61 70 66 83 98 87C66 91 61 104 60 142C59 104 54 91 22 87C54 83 59 70 60 38Z" fill="url(#g)"/><path d="M60 3Q61 11 69 12Q61 13 60 22Q59 13 51 12Q59 11 60 3Z" fill="url(#g)"/></svg><span>SIRIUS</span></a>
<div class="nav"><a href="menu.html">Menü</a><a href="index.html">← Ana Sayfa</a></div>
</div></header>

<div class="wrap">
<div class="top"><h1 class="gold">KENDİ ÜRETİMİMİZ</h1><p class="sub">Doğal, katkısız, emekle yetişen lezzetler.</p><div class="line"></div></div>
<div class="grid" id="grid"></div>
<p class="info">Fiyatlar kilogram veya litre başınadır. Stok ve sipariş için bize ulaşın.</p>
<div class="cta"><a class="btn fill" href="https://wa.me/905551081684" target="_blank" rel="noopener">WhatsApp ile Sipariş Ver</a></div>
</div>
<footer>© <span id="y"></span> Sirius Cafe · <a href="https://www.instagram.com/siriuscoffee41/" target="_blank" rel="noopener">@siriuscoffee41</a></footer>
<script>
/* Fiyat veya ürün değiştirmek için sadece bu listeyi düzenle.
   fiyat yoksa "Fiyat için sorunuz" yazar. */
const URUNLER = [
  { ad: "İlaçlık Doğal Bal", aciklama: "Şeker katılmamış, doğal bal.", fiyat: 2500, birim: "kg" },
  { ad: "Doğal Zeytinyağı", aciklama: "Ata eşek zeytininden elde edilen doğal zeytinyağı.", fiyat: 1500, birim: "litre" },
  { ad: "Duble Doğal Samanlı Zeytin", aciklama: "Geleneksel yöntemle, samanlı doğal zeytin.", fiyat: 230, birim: "kg" },
  { ad: "Eşek Zeytini", aciklama: "Kendi bahçemizden doğal zeytin.", birim: "kg" },
  { ad: "Doğal Ata Ağacından İncir", aciklama: "Ata ağacından toplanan doğal incir.", fiyat: 180, birim: "kg" },
  { ad: "Premium Erik", aciklama: "Özenle seçilmiş premium erik.", fiyat: 170, birim: "kg" },
];
const fmt = n => n.toLocaleString('tr-TR') + ' ₺';
document.getElementById('grid').innerHTML = URUNLER.map((u,k)=>{
  const msg = encodeURIComponent('Merhaba, ' + u.ad + ' hakkında bilgi almak istiyorum.');
  const fiyat = u.fiyat ? `<div class="price">${fmt(u.fiyat)}<small>/ ${u.birim}</small></div>` : `<div class="price ask">Fiyat için sorunuz</div>`;
  return `<div class="card" style="--k:${k}"><i>✦</i><h3>${u.ad}</h3><p>${u.aciklama}</p>${fiyat}<a class="btn" href="https://wa.me/905551081684?text=${msg}" target="_blank" rel="noopener">Sipariş / Bilgi</a></div>`;
}).join('');
document.getElementById('y').textContent = new Date().getFullYear();
</script>
</body>
</html>
