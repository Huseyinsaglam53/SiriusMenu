<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sirius Cafe & Bistro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-container">
        
        <div class="menu-page active" id="sayfa-kapak" onclick="sayfaDegistir('sayfa-ana-menu')">
            <img src="images/1 (3).png" class="menu-bg">
        </div>

        <div class="menu-page" id="sayfa-ana-menu">
            <img src="images/AÇILIŞ (3).png" class="menu-bg">
            <button class="btn-kategori" style="top: 24.5%; height: 11%;" onclick="sayfaDegistir('sayfa-yemek-secenekleri')"></button>
            <button class="btn-kategori" style="top: 39.5%; height: 11%;" onclick="sayfaDegistir('sayfa-mesrubat')"></button>
            <button class="btn-kategori" style="top: 54.5%; height: 11%;" onclick="sayfaDegistir('sayfa-tatli')"></button>
            <button class="btn-kategori" style="top: 69.5%; height: 11%;" onclick="sayfaDegistir('sayfa-icecek-secenek')"></button>
            <button class="btn-kategori" style="top: 83.5%; height: 13%;" onclick="sayfaDegistir('sayfa-mokteyl')"></button>
        </div>

        <div class="menu-page" id="sayfa-yemek-secenekleri">
            <button class="btn-geri" onclick="sayfaDegistir('sayfa-ana-menu')"></button>
            <img src="images/YEMEK SEÇENEKLERİ (3).png" class="menu-bg">
            <button class="btn-kategori" style="top: 24.5%; height: 11%;" onclick="sayfaDegistir('sayfa-burger')"></button>
            <button class="btn-kategori" style="top: 39.5%; height: 11%;" onclick="sayfaDegistir('sayfa-pizza')"></button>
            <button class="btn-kategori" style="top: 54.5%; height: 11%;" onclick="sayfaDegistir('sayfa-aperatif')"></button>
            <button class="btn-kategori" style="top: 69.5%; height: 11%;" onclick="sayfaDegistir('sayfa-makarna')"></button>
        </div>

        <div class="menu-page" id="sayfa-burger">
            <button class="btn-geri" onclick="sayfaDegistir('sayfa-yemek-secenekleri')"></button>
            <img src="images/YEMEK-HAMBUGRER (3).png" class="menu-bg">
        </div>

        <div class="menu-page" id="sayfa-pizza">
            <button class="btn-geri" onclick="sayfaDegistir('sayfa-yemek-secenekleri')"></button>
            <img src="images/YEMEK PIZZA (3).png" class="menu-bg">
        </div>

        <div class="menu-page" id="sayfa-aperatif">
            <button class="btn-geri" onclick="sayfaDegistir('sayfa-yemek-secenekleri')"></button>
            <img src="images/YEMEK APERATIF (3).png" class="menu-bg">
        </div>

        <div class="menu-page" id="sayfa-makarna">
            <button class="btn-geri" onclick="sayfaDegistir('sayfa-yemek-secenekleri')"></button>
            <img src="images/YEMEK MAKARNA (3).png" class="menu-bg">
        </div>

        <div class="menu-page" id="sayfa-mesrubat">
            <button class="btn-geri" onclick="sayfaDegistir('sayfa-ana-menu')"></button>
            <img src="images/SICAK-ICECEKLER-YENI.png" class="menu-bg">
        </div>

        <div class="menu-page" id="sayfa-tatli">
            <button class="btn-geri" onclick="sayfaDegistir('sayfa-ana-menu')"></button>
            <img src="images/TATLILAR (3).png" class="menu-bg">
        </div>

        <div class="menu-page" id="sayfa-icecek-secenek">
            <button class="btn-geri" onclick="sayfaDegistir('sayfa-ana-menu')"></button>
            <img src="images/İÇECEK SEÇENEKLERİ (3).png" class="menu-bg">
            <button class="btn-kategori" style="top: 24.5%; height: 11%;" onclick="sayfaDegistir('sayfa-sicak-icecek')"></button>
            <button class="btn-kategori" style="top: 42.5%; height: 11%;" onclick="sayfaDegistir('sayfa-soguk-icecek')"></button>
        </div>

        <div class="menu-page" id="sayfa-sicak-icecek">
            <button class="btn-geri" onclick="sayfaDegistir('sayfa-icecek-secenek')"></button>
            <img src="images/SICAK İÇECEKLER (3).png" class="menu-bg">
        </div>

        <div class="menu-page" id="sayfa-soguk-icecek">
            <button class="btn-geri" onclick="sayfaDegistir('sayfa-icecek-secenek')"></button>
            <img src="images/SOĞUK İÇECEKLER (3).png" class="menu-bg">
        </div>

        <div class="menu-page" id="sayfa-mokteyl">
            <button class="btn-geri" onclick="sayfaDegistir('sayfa-ana-menu')"></button>
            <img src="images/MOKTEYLLER (3).png" class="menu-bg">
        </div>

    </div>

    <script src="script.js"></script>

</html>
