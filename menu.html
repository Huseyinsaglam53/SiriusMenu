    { ad: "Cheese + Small Anne", aciklama: "Cheese burger + Anne burger", fiyat: 440 },
    { ad: "Trüf + Tavuk", aciklama: "Trüf burger + Tavuk burger", fiyat: 550 },
  ]},
  { kategori: "Kahve & Tatlı Menüleri", ozel: true, urunler: [
    { ad: "Kahve + San Sebastian", aciklama: "Seçilebilir kahve + San Sebastian", fiyat: 350 },
    { ad: "Kahve + Magnolya", aciklama: "Seçilebilir kahve + Magnolya", fiyat: 320 },
    { ad: "Kahve + Supangle", aciklama: "Kahve + Supangle", fiyat: 199 },
  ]},
];
/* ================================================== */
/* ALERJENLER: g=Gluten s=Süt y=Yumurta h=Hardal u=Susam k=Kabuklu yemiş o=Soya · "?"=günlük değişir · Listede olmayan ürün = alerjen bildirilmemiş. MUTFAKTAKİ GERÇEK REÇETELERE GÖRE KONTROL EDİP DÜZELTİN. */
const AL={g:'Gluten',s:'Süt',y:'Yumurta',h:'Hardal',u:'Susam',k:'Kabuklu yemiş',o:'Soya'};
const ALG={"Menengiç Kahvesi":"sk","Dibek Kahvesi":"s","Cappuccino":"s","Cappuccino Brûlée":"s","Latte":"s","Latte Macchiato":"s","Mocha":"so","White Chocolate Mocha":"so","Espresso Macchiato":"s","Flat White":"s","Caramel Latte":"so","Cortado":"s","Salep":"s","Sıcak Çikolata":"so",
"Milkshake":"sg","Ice Latte":"s","Ice Mocha":"so","Ice White Mocha":"so","Frappe":"s","Ayran":"s",
"U.S.A. Burger":"gsyhu","Trüf Burger":"gsyhu","Kibrit Burger":"gyhu","Angry Burger":"gyhu","Cheese Burger":"gsyhu","Anne Burger":"gyhu","Tavuk Burger":"gyhu",
"Dört Peynirli Pizza":"gs","Mantarlı Pizza":"gs","Karışık Pizza":"gs","Pepperoni Pizza":"gs","Mexican Pizza":"gs","Margarita Pizza":"gs",
"Kaşarlı Gözleme":"gs","Sucuk Kaşarlı Gözleme":"gs","Patatesli Gözleme":"g","Peynirli Gözleme":"gs","Kaşarlı Tost":"gs","Karışık Tost":"gs","Çift Kaşarlı Tost":"gs","Sucuklu Tost":"gs",
"Porsiyon Patates Çeşitleri":"s","Soğan Halkası":"gy","Patates Kroket":"gys","Cheese Sticks":"gys",
"Fettuccine Alfredo":"gys","Pesto Soslu Fettuccine":"gysk","Mantarlı Kremalı Fettuccine":"gys","Peynirli Ravioli":"gys","Günün Çorbası":"?",
"San Sebastian":"gsy","Lotus Cup":"gso","Spoonful":"gsy","Cheesecake":"gsy","Tiramisu":"gsy","Dökme Profiterol":"gsy","Magnolya":"gs","Fırında Sütlaç":"s","Supangle":"sy","Bardak Waffle":"gsyo","Tabak Waffle":"gsyo",
"Small Anne":"gyhus","Small Cheese":"gyhus","Small Angry":"gyhus","Small USA":"gyhus",
"Pizza Menüsü":"gs","Tavuk + Small Cheese":"gsyhu","Cheese + Small Anne":"gsyhu","Trüf + Tavuk":"gsyhu",
"Kahve + San Sebastian":"gsy","Kahve + Magnolya":"gs","Kahve + Supangle":"sy"};
const alg=n=>{const a=ALG[n];if(!a)return '';return `<span class="al"><em>${t('Alerjen:')}</em>`+(a==='?'?`<b>${t('Günlük değişir, sorunuz')}</b>`:[...a].map(c=>`<b>${t(AL[c])}</b>`).join(''))+`</span>`};
var up=document.getElementById('up');
addEventListener('scroll',function(){if(up)up.classList.toggle('show',scrollY>500)});
if(up)up.onclick=function(){scrollTo({top:0,behavior:'smooth'})};
var io=new IntersectionObserver(function(e){e.forEach(function(i){if(i.isIntersecting){i.target.classList.add('in');io.unobserve(i.target)}})},{threshold:.08});
function obs(){document.querySelectorAll('.rv:not(.in)').forEach(function(e){io.observe(e)})}
(function(){var c=document.getElementById('stars');if(!c)return;var x=c.getContext('2d'),S=[],M=[],W,H,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function sz(){W=c.width=innerWidth;H=c.height=innerHeight;S=[];for(var i=0;i<Math.min(120,W*H/13000);i++)S.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,p:Math.random()*6.28,v:Math.random()*.02+.005})}
function shoot(){M.push({x:W*(.35+Math.random()*.65),y:Math.random()*H*.35,v:10+Math.random()*5})}
if(!rm)setInterval(function(){if(!document.hidden&&Math.random()<.65)shoot()},4200);
function d(){x.clearRect(0,0,W,H);S.forEach(function(s){s.p+=s.v;x.globalAlpha=.25+.55*Math.abs(Math.sin(s.p));x.fillStyle='#e9cf94';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()});
M=M.filter(function(m){m.x-=m.v;m.y+=m.v*.55;var g=x.createLinearGradient(m.x,m.y,m.x+m.v*10,m.y-m.v*5.5);g.addColorStop(0,'rgba(245,220,160,.95)');g.addColorStop(1,'rgba(245,220,160,0)');x.globalAlpha=1;x.strokeStyle=g;x.lineWidth=1.4;x.beginPath();x.moveTo(m.x,m.y);x.lineTo(m.x+m.v*10,m.y-m.v*5.5);x.stroke();return m.x>-250&&m.y<H+60});
if(!rm)requestAnimationFrame(d)}
addEventListener('resize',sz);sz();d()})();
var pg=document.getElementById('pg');
addEventListener('scroll',function(){var h=document.documentElement.scrollHeight-innerHeight;if(pg)pg.style.width=(h>0?scrollY/h*100:0)+'%'});
var gl=document.getElementById('glow');
if(gl&&matchMedia('(hover:hover)').matches)addEventListener('mousemove',function(e){gl.style.transform='translate('+(e.clientX-250)+'px,'+(e.clientY-250)+'px)';gl.style.opacity=1});
document.addEventListener('mousemove',function(e){var t=e.target.closest&&e.target.closest('.card,.cat');if(t){var r=t.getBoundingClientRect();t.style.setProperty('--mx',(e.clientX-r.left)+'px');t.style.setProperty('--my',(e.clientY-r.top)+'px')}});
const menuEl=document.getElementById('menu'),tabsEl=document.getElementById('tabs');
let cur=null,qs='';
const lc=t=>t.toLocaleLowerCase('tr');
function render(filter){
  if(filter!==undefined)cur=filter;
  const html=MENU.filter(k=>!cur||k.kategori===cur).map(k=>{
    const us=k.urunler.filter(u=>lc(u.ad+' '+t(u.ad)+' '+(u.aciklama||'')+' '+td(u.aciklama||'')).includes(qs));
    if(!us.length)return '';
    return `<section class="cat rv${k.ozel?' promo':''}"><h2><i>✦</i>${t(k.kategori)}</h2>`+us.map((u,j)=>`<div class="item" style="--k:${j}"><div><span class="n">${t(u.ad)}</span>${u.aciklama?`<span class="d">${td(u.aciklama)}</span>`:''}${alg(u.ad)}</div><span class="dots"></span><span class="p${u.secenek?' multi':''}">${pr(u)}</span></div>`).join('')+(k.not?`<p class="note">${t(k.not)}</p>`:'')+`</section>`;
  }).join('');
  menuEl.innerHTML=html?`<div class="cats">${html}</div>`:`<p class="empty">${t('Aradığınız ürün bulunamadı.')}</p>`;
  [...tabsEl.children].forEach(b=>{const on=(b.dataset.k||null)===cur;b.classList.toggle('on',on);if(on&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest'})});
  obs();
}
tabsEl.innerHTML=`<button data-k="">${t('Tümü')}</button>`+MENU.map(k=>`<button data-k="${k.kategori}">${t(k.kategori)}</button>`).join('');
tabsEl.onclick=e=>{if(e.target.tagName==='BUTTON'){render(e.target.dataset.k||null);scrollTo({top:document.getElementById('q').offsetTop-70,behavior:'smooth'})}};
document.getElementById('q').oninput=e=>{qs=lc(e.target.value.trim());render()};
(function(){var q=document.getElementById('q');q.placeholder=t('Menüde ara…');q.setAttribute('aria-label',t('Menüde ara'))})();
render(null);

/* sayfalar arası yumuşak geçiş */
(function(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a||a.target||e.metaKey||e.ctrlKey||e.shiftKey)return;var h=a.getAttribute('href');if(!h||h.charAt(0)==='#'||/^(https?:|tel:|mailto:)/.test(h))return;e.preventDefault();document.body.classList.add('leave');setTimeout(function(){location.href=h},280)});
addEventListener('pageshow',function(e){if(e.persisted)document.body.classList.remove('leave')})})();
</script>
